[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy /api a Render en producción
[[redirects]]
  from = "/api/*"
  to = "https://myl-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
